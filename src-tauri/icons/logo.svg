<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Stack of papers icon -->
  <defs>
    <linearGradient id="stackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bottom paper -->
  <rect x="30" y="140" width="160" height="90" rx="6" fill="#F7931E" opacity="0.6"/>
  
  <!-- Middle paper -->
  <rect x="30" y="100" width="160" height="90" rx="6" fill="#FF6B35" opacity="0.8"/>
  
  <!-- Top paper -->
  <rect x="30" y="60" width="160" height="90" rx="6" fill="url(#stackGradient)"/>
  
  <!-- Decorative lines on top paper -->
  <line x1="50" y1="80" x2="170" y2="80" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="50" y1="100" x2="170" y2="100" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="120" x2="120" y2="120" stroke="white" stroke-width="2" opacity="0.5"/>
</svg>
